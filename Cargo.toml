# TLDR-RS: Token-efficient code analysis tool
# This is a virtual workspace - the actual package is in crates/tldr-core

[workspace]
members = [
    "crates/tldr-core",
    "crates/tldr-cli",
    "crates/tldr-daemon",
    "crates/tldr-mcp",
]
resolver = "2"

[workspace.package]
version = "0.4.1-fork.1"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/parcadei/tldr-code"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# M5: Use preserve_order for consistent JSON serialization
serde_json = { version = "1.0", features = ["preserve_order"] }

# Parsing - PINNED versions for PM-1.1 (Tree-sitter Version Mismatch)
# See: docs/GRAMMAR_COMPATIBILITY.md for version rationale
# See: crates/tldr-core/tests/grammar_stability_test.rs for node type verification
#
# IMPORTANT: Do not use ^ or ~ - use exact versions (=X.Y.Z) to prevent:
#   1. Silent grammar version drift during cargo update
#   2. AST node type renames breaking extraction logic
#   3. ABI incompatibility between tree-sitter core and grammars
#
# To upgrade: Run grammar_stability_test first, then update both Cargo.toml and Cargo.lock
tree-sitter = "=0.25.0"
tree-sitter-python = "=0.23.6"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.23.4"
tree-sitter-rust = "=0.23.3"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.23.4"
tree-sitter-cpp = "=0.23.4"
# Formats extension (2025-09): data/config/markup/web/shell/db grammars.
# Each grammar crate must load against tree-sitter 0.25 (ABI 14/15 both
# accepted at runtime: LANGUAGE_VERSION=15, MIN_COMPATIBLE=13). Verified by
# `cargo test -p tldr-core --test grammar_stability_test` + the parse smoke
# tests in ast/parser.rs tests. "All tree-sitter formats" directive (#8b follow-up).
tree-sitter-json = "=0.24.0"
tree-sitter-yaml = "=0.7.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-xml = "=0.7.0"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.23.2"
tree-sitter-bash = "=0.23.3"
# LaTeX (2025-11): document markup (.tex/.sty/.cls) — sections + environments
# as elements. The audited `tree-sitter-latex =0.1.0` (crates.io, 2025-02-08)
# is UNLINKABLE as published: its grammar.js declares `externals`, so the
# generated parser.c references `tree_sitter_latex_external_scanner_*`, but the
# package ships no scanner.c and its build.rs only compiles a scanner
# conditionally (`if scanner_path.exists()`) → undefined-symbol link errors in
# every consumer build (reproduced 2025-11). `codebook-tree-sitter-latex
# =0.6.1` republishes the MAINTAINED grammar (latex-lsp/tree-sitter-latex)
# with src/scanner.c included, a tree-sitter-language bridge `LANGUAGE`
# LanguageFn (loads against the pinned ts 0.25 runtime like every format
# grammar above) and the same section/environment node kinds the element
# walker needs (verified against its src/node-types.json). Verified by
# `cargo test -p tldr-core --test grammar_stability_test` + the latex parse
# smoke test in tests/formats_grammar_test.rs.
codebook-tree-sitter-latex = "=0.6.1"
# Markdown (2026-09): document markup (.md/.markdown) — headings, fenced and
# indented code blocks, and pipe tables surface as element definitions (see
# `ast::elements::walk_markdown`). Pinned to the tree-sitter-grammars org
# crate `tree-sitter-md =0.5.3` (published 2026-02-26, actively maintained —
# the old `tree-sitter-markdown` 0.7.1 is dead and NOT used). CRITICAL crate
# fact (read off bindings/rust/lib.rs): it exports TWO grammars, `LANGUAGE`
# (block structure) and `INLINE_LANGUAGE` (inline content) — there is NO
# combined markdown language. We wire the BLOCK grammar: headings/code
# fences/tables are block nodes, which is what the element walker needs; the
# inline grammar would require injection parsing and is deliberately not
# wired, so inline spans stay as opaque `inline` nodes (documented at
# walk_markdown). The crate declares `tree-sitter ^0.26` as an OPTIONAL dep
# activated only by its `parser` feature; consumed WITHOUT that feature the
# `LANGUAGE`/`INLINE_LANGUAGE` LanguageFn exports ride the tree-sitter-language
# bridge (0.1, already in the tree for luau/latex) and load against the pinned
# tree-sitter 0.25 runtime. Build-verified: parser.c + scanner.c for BOTH
# grammars ship in the package and compile via its build.rs (unlike the
# unbuildable tree-sitter-latex 0.1.0 precedent). Gated by
# grammar_stability_test + the markdown parse smoke test in
# tests/formats_grammar_test.rs.
tree-sitter-md = "=0.5.3"
# NOTE: tree-sitter-sql dropped — crates.io only publishes 0.0.2 (DerekStride
# grammar is source-only); revisit if a maintained sql crate targets ts 0.25.
# NOTE: tree-sitter-csv dropped (CSV/TSV batch, 2026-09) — the only CSV
# grammar crate on crates.io, tree-sitter-csv 1.2.0 (last publish 2024-01-24),
# is UNBUILDABLE and UNLINKABLE in this workspace, verified by build probe:
# (1) its build-dep `cc ~1.0.82` semver-conflicts with the `cc ^1.2.10` the
# pinned tree-sitter 0.25 stack requires — cargo refuses the duplicate cc
# requirement; (2) its exports are raw ts-0.20-era `language_csv()` functions
# with NO tree-sitter-language bridge LanguageFn, so it cannot load against
# the pinned ts 0.25 runtime (the latex/markdown bridge precedent). `.csv`/
# `.tsv` are therefore handled by the NATIVE RFC 4180 streaming record
# scanner in `crates/tldr-core/src/ast/csvscan` (Log/Text no-grammar
# precedent) — revisit if a maintained csv crate ships a bridge LanguageFn
# and drops the pinned cc build-dep.
# Phase 3: Ruby grammar
# Note: tree-sitter-ruby 0.23.1 uses tree-sitter-language crate for ABI compatibility
tree-sitter-ruby = "=0.23.1"
# Phase 3: Kotlin and Swift
# - tree-sitter-kotlin-ng 1.1.0 requires tree-sitter ^0.24 (compatible!)
#   See: https://github.com/tree-sitter-grammars/tree-sitter-kotlin
# - tree-sitter-swift 0.7.1 grammar (ABI v15) - works with tree-sitter >=0.25.0
#   See: https://github.com/alex-pinkus/tree-sitter-swift
tree-sitter-swift = "=0.7.1"
tree-sitter-kotlin-ng = "=1.1.0"
# Phase 4: C#, Scala, PHP grammars
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-scala = "=0.24.0"
# Note: PHP 0.24.2 has ABI version 15, incompatible with tree-sitter 0.24.7 (expects v14)
# Using 0.23.11 which should have ABI v14
tree-sitter-php = "=0.23.11"
# Phase 5: Lua, Luau, Elixir grammars
# Note: tree-sitter-lua 0.4.1 requires tree-sitter ^0.26.3 (incompatible), using 0.2.0 (^0.23)
tree-sitter-lua = "=0.2.0"
# Note: tree-sitter-luau 1.2.0 requires tree-sitter ^0.24 (compatible)
tree-sitter-luau = "=1.2.0"
# Note: tree-sitter-elixir 0.3.4 requires tree-sitter ^0.23.0 (compatible)
tree-sitter-elixir = "=0.3.4"
# Note: tree-sitter-ocaml 0.24.2 - OCaml grammar
tree-sitter-ocaml = "=0.24.2"

# Async
tokio = { version = "1.0", features = ["full", "sync"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# HTTP server - Phase 10: Daemon
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }

# Tracing for observability (M22)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
md5 = "0.7"

# Session 16: Semantic Search - fastembed embeddings
# PINNED per premortem P0 - do not use ^5.8 or 5
fastembed = "=5.8.1"

# Session 16 Phase 5: File locking for cache (P0 mitigation)
fs2 = "0.4"

# LRU cache
lru = "0.12"

# Binary lookup on PATH (M11 VAL-010: change-impact git resolver)
which = "6"

# Testing
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"

# Signal handling
ctrlc = { version = "3.4", features = ["termination"] }

# YAML parsing
serde_yaml = "0.9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File system - Phase 2
walkdir = "2"
ignore = "0.4"
dunce = "1.0"

# OOXML containers (2026-xx): .docx/.xlsx/.pptx are ZIP packages whose XML
# parts feed the existing element walker (ast::ooxml). `deflate` is the only
# compression method those formats use; default-features = false keeps the
# aes-crypto/bzip2/lzma/ppmd/zstd/xz backends AND the `time` dep out of the
# build. Pinned exact per the workspace policy above. 8.6.0 is the latest
# stable at adoption (MSRV 1.88, below this repo's 1.97 toolchain); its
# `deflate` feature routes through flate2's zlib-rs backend + zopfli, both
# pure Rust — no C toolchain involvement.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

# Difftastic L1/L2 graft - Phase 1
bumpalo = "3.16.0"
typed-arena = "2.0.2"
strsim = "0.11.0"
radix-heap = "0.4.2"
hashbrown = "0.14.0"
rustc-hash = "2.0.0"
smallvec = "1.13.2"
line-numbers = "0.3.0"
wu-diff = "0.1.2"

[profile.release]
# Optimize for size and speed
lto = true
codegen-units = 1
opt-level = 3
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
